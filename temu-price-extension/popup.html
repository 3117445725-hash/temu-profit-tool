body{font:14px "Microsoft YaHei",sans-serif;width:370px;margin:16px;color:#18334a}h2{font-size:18px}button{padding:8px;margin:4px 2px;cursor:pointer}input{padding:5px}#status{white-space:pre-wrap;background:#f1f5f8;padding:10px;max-height:260px;overflow:auto}.note{font-size:12px;line-height:1.6;color:#526375}#quiet{background:#136ac8;color:white;border:0;border-radius:4px}summary{cursor:pointer}
</style></head><body><h2>订单价格采集 · 0.4.1</h2><p id="bridge">检查本机桥接…</p><button id="connect">连接桥接</button><button id="disconnect">断开桥接</button><p class="note">直接扫描当前店铺订单，按月份核对并排除已取消；在独立后台标签读取，不切换前台页面。不操作发货、确认或运单。</p><label>订单月份 <input id="month" type="month"></label><button id="quiet">开始整月后台采集</button><button id="update">检查插件云端更新</button><details><summary>可选：已有订单CSV时加速采集</summary><p><input id="orderFile" type="file" accept=".csv"><span id="importStatus">尚未导入订单</span></p><button id="importStart">按CSV采集</button></details><details><summary>兼容模式 / 单笔验证</summary><label><input id="next" type="checkbox"> 自动下一页（仅兼容模式）</label><br><button id="start">采集当前筛选列表</button><button id="capture">读取当前详情</button></details><br><button id="pause">暂停</button><button id="resume">继续</button><button id="export">导出价格表</button><button id="full">导出订单表</button><button id="clear">清空采集记录</button><p id="status">正在读取状态…</p><p class="note">每个浏览器单独登录。后台采集请保持店铺不切换；其他标签可照常使用。首次需有一个已打开或已采过的详情作为页面地址样本，不猜接口。登录或验证码时暂停。</p><script src="order-import.js"></script><script src="popup.js"></script></body></html>
